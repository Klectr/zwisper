name: Release

# Push a version tag to publish a release:
#   git tag v0.1.0 && git push origin v0.1.0
# The tag must match the version in Cargo.toml and packaging/macos/Info.plist.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release and upload the DMG

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: Build and publish (macOS, Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          plist_ver=$(plutil -extract CFBundleShortVersionString raw packaging/macos/Info.plist)
          echo "tag=$tag Cargo.toml=$cargo_ver Info.plist=$plist_ver"
          if [ "$tag" != "$cargo_ver" ] || [ "$tag" != "$plist_ver" ]; then
            echo "::error::Tag v$tag doesn't match Cargo.toml ($cargo_ver) and Info.plist ($plist_ver). Bump both, then tag."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build Zwisper.app and Zwisper.dmg
        run: ./scripts/bundle-macos.sh   # CI is set, so: ad-hoc signed, DMG not opened

      - name: Checksum
        working-directory: target/release/bundle
        run: shasum -a 256 Zwisper.dmg | tee Zwisper.dmg.sha256

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          **Download `Zwisper.dmg` below**, open it, and drag Zwisper into Applications.
          Requires macOS 14.4 or later on Apple Silicon.

          Zwisper isn't notarized by Apple, so macOS blocks it the first time you open it.
          Go to **System Settings → Privacy & Security** and click **Open Anyway**.

          Free for everyone, local-only. Free software under the GNU GPL v3 (see LICENSE and NOTICE).
          EOF
          dmg=target/release/bundle/Zwisper.dmg
          sum=target/release/bundle/Zwisper.dmg.sha256
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Re-running a tag: replace the files, keep the notes.
            gh release upload "$GITHUB_REF_NAME" "$dmg" "$sum" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$dmg" "$sum" \
              --title "Zwisper ${GITHUB_REF_NAME#v}" \
              --notes-file notes.md --generate-notes --verify-tag
          fi
