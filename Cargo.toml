[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/adapters/fakes",
    "crates/adapters/templates",
    "crates/adapters/store-fs",
    "crates/adapters/models-http",
    "crates/adapters/sherpa",
    "crates/adapters/llama",
    "crates/adapters/audio-macos",
    "crates/adapters/platform-macos",
    "crates/ui",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
zwisper-core = { path = "crates/core" }
zwisper-fakes = { path = "crates/adapters/fakes" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
crossbeam-channel = "0.5"
arc-swap = "1"
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
ulid = { version = "1", features = ["serde"] }
strsim = "0.11"
tracing = "0.1"

# xattr 0.2.3 (pulled in by gpui's http client) doesn't build against newer libc on Linux.
[patch.crates-io]
xattr = { path = "third_party/xattr" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
