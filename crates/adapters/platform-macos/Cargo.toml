[package]
name = "zwisper-platform-macos"
description = "macOS OS integration: global hotkeys, text injection, permissions, login item, window helpers."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zwisper-core.workspace = true
chrono.workspace = true
tracing.workspace = true
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.10"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSArray", "NSDictionary", "NSValue", "NSError", "NSThread", "NSData", "NSObject", "NSEnumerator"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFString", "CFDictionary", "CFNumber", "CFCGTypes"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSWorkspace", "NSWindow", "NSPanel", "NSResponder", "NSApplication", "NSRunningApplication", "objc2-core-foundation"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventTypes", "CGRemoteOperation", "CGEventSource"] }
objc2-application-services = { version = "0.3", default-features = false, features = ["std", "AXUIElement", "HIServices"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
