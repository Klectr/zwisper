[package]
name = "zwisper-audio-macos"
description = "macOS audio capture: cpal microphone + Core Audio process tap for system output."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zwisper-core.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSUUID", "NSValue", "NSProcessInfo", "NSDictionary", "NSObject"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFString", "CFDictionary", "CFArray", "CFNumber"] }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "block2", "objc2-core-audio-types", "AudioHardware", "libc"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
